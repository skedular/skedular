schema {
  query: Query
  mutation: Mutation
}

type AcceptInvitationToJoinOrganizationPayload {
  clientMutationId: String
}

type CancelInvitationToJoinOrganizationPayload {
  clientMutationId: String
}

type CancelOrganizationOfferingPayload {
  clientMutationId: String
}

type InviteCustomersToJoinOrganizationPayload {
  clientMutationId: String
}

type Mutation {
  addOrganization(input: AddOrganizationInput!): OrganizationPayload @cost(weight: "10")
  updateOrganization(input: UpdateOrganizationInput!): OrganizationPayload @cost(weight: "10")
  deleteOrganization(input: DeleteOrganizationInput!): OrganizationPayload @cost(weight: "10")
  updateOrganizationOffering(input: UpdateOrganizationOfferingInput!): UpdateOrganizationOfferingPayload @cost(weight: "10")
  cancelOrganizationOffering(input: CancelOrganizationOfferingInput!): CancelOrganizationOfferingPayload @cost(weight: "10")
  changeOrganizationMemberRole(input: ChangeOrganizationMemberRoleInput!): OrganizationMemberDetailsPayload @cost(weight: "10")
  changeOrganizationMembersStatus(input: ChangeOrganizationMembersStatusInput!): OrganizationMembersDetailsPayload @cost(weight: "10")
  removeOrganizationMembers(input: RemoveOrganizationMembersInput!): OrganizationMembersDetailsPayload @cost(weight: "10")
  inviteCustomersToJoinOrganization(input: InviteCustomersToJoinOrganizationInput!): InviteCustomersToJoinOrganizationPayload @cost(weight: "10")
  acceptInvitationToJoinOrganization(input: AcceptInvitationToJoinOrganizationInput!): AcceptInvitationToJoinOrganizationPayload @cost(weight: "10")
  rejectInvitationToJoinOrganization(input: RejectInvitationToJoinOrganizationInput!): RejectInvitationToJoinOrganizationPayload @cost(weight: "10")
  cancelInvitationToJoinOrganization(input: CancelInvitationToJoinOrganizationInput!): CancelInvitationToJoinOrganizationPayload @cost(weight: "10")
  completeOrganizationMemberOnboarding(input: CompleteOrganizationMemberOnboardingInput!): OrganizationMemberPayload @cost(weight: "10")
  addCustomTag(input: AddCustomTagInput!): OrganizationTagPayload @cost(weight: "10")
  updateCustomTag(input: UpdateCustomTagInput!): OrganizationTagPayload @cost(weight: "10")
  deleteCustomTag(input: DeleteCustomTagInput!): OrganizationTagPayload @cost(weight: "10")
  deleteCustomTags(input: DeleteCustomTagsInput!): OrganizationTagsPayload @cost(weight: "10")
  addZone(input: AddZoneInput!): OrganizationTagPayload @cost(weight: "10")
  updateZone(input: UpdateZoneInput!): OrganizationTagPayload @cost(weight: "10")
  deleteZone(input: DeleteZoneInput!): OrganizationTagPayload @cost(weight: "10")
  deleteZones(input: DeleteZonesInput!): OrganizationTagsPayload @cost(weight: "10")
}


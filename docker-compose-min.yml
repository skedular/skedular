networks:
  skedular_network:

volumes:
  skedular_postgres18_data:
  skedular_redis_data:
  skedular_kafka1_data:
  skedular_temporal_data:

services:
  postgres:
    image: postgis/postgis:18-master
    platform: linux/amd64
    command: postgres -c 'max_connections=10000' -c 'shared_preload_libraries=pg_stat_statements'
    restart: unless-stopped
    volumes:
      - skedular_postgres18_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: "8b974997c3c54b10a556f089377505d7"
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    networks:
      - skedular_network

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - skedular_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 100
    networks:
      - skedular_network

  redisinsight:
    image: redislabs/redisinsight:latest
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - skedular_network

  kafka1:
    image: redpandadata/redpanda:latest
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka1:29092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:9100
      - --rpc-addr kafka1:33145
      - --advertise-rpc-addr kafka1:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - skedular_kafka1_data:/var/lib/redpanda/data
    ports:
      - "19092:19092"
      - "9100:9100"
    healthcheck:
      test:
        ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 90s
    networks:
      - skedular_network

  kowl:
    image: redpandadata/console:latest
    restart: unless-stopped
    depends_on:
      - kafka1
    environment:
      KAFKA_BROKERS: "kafka1:29092"
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: "http://kafka1:8081"
    ports:
      - 8888:8080
    networks:
      - skedular_network

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - 7233:7233
    environment:
      - DB=postgres12
      - POSTGRES_SEEDS=postgres
      - DB_PORT=5432
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - POSTGRES_USER=8b974997c3c54b10a556f089377505d7
      - POSTGRES_PWD=123456
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - skedular_network

  temporal-admin-tools:
    image: temporalio/admin-tools:latest
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    stdin_open: true
    tty: true
    networks:
      - skedular_network

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    depends_on:
      - temporal
    ports:
      - 8080:8080
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    networks:
      - skedular_network

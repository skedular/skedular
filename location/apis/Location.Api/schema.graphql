input AddLocationPhysicalAddressInput {
  clientMutationId: String
  id: String
  locationId: String!
  osmType: String
  osmId: String
  placeId: String
  longitude: Float
  latitude: Float
  formattedAddress: String
  addressLine1: String!
  addressLine2: String
  suburb: String
  city: String
  province: String
  zipcode: String!
  country: String!
  countryCode: String
}

input AddResourceInput {
  clientMutationId: String
  id: String
  name: String!
  inactive: Boolean!
  locationId: String!
  customTagIds: [String!]!
  zoneIds: [String!]!
  productTagIds: [String!]!
  requireBookingApproval: Boolean!
  color: String
  capacity: Int!
  organizationResourceTypeId: String!
}

input AreaRangeInput {
  fromInSqm: String!
  toInSqm: String!
}

input CdnFileInput {
  url: String!
  height: Int
  width: Int
}

input CdnImageFileInput {
  original: CdnFileInput
  thumbnail: CdnFileInput
}

input ContactDetailsInput {
  contactPeople: [String!]
  contactEmails: [String!]
  contactPhones: [String!]
}

input DeactivateResourcesInput {
  clientMutationId: String
  ids: [String!]!
}

input DeleteFloorPlanInput {
  clientMutationId: String
  id: String!
}

input DeleteLocationInput {
  clientMutationId: String
  id: String!
}

input DeleteResourceInput {
  clientMutationId: String
  id: String!
}

input DeleteResourcesInput {
  clientMutationId: String
  ids: [String!]!
}

input FloorPlanOrderInput {
  direction: OrderDirection!
  field: FloorPlanOrderField!
}

input FloorPlanWhereInput {
  locationId: String!
}

input LocationExtraMetadataInput {
  contactDetails: ContactDetailsInput
  areaRange: AreaRangeInput
  peopleCapacity: PeopleCapacityInput
  website: String
  relatedImageLinks: [String!]
  relatedVideoLinks: [String!]
  otherLinks: [String!]
}

input LocationOrderInput {
  direction: OrderDirection!
  field: LocationOrderField!
}

input LocationPhysicalAddressInput {
  osmType: String
  osmId: String
  placeId: String
  longitude: Float
  latitude: Float
  formattedAddress: String
  addressLine1: String!
  addressLine2: String
  suburb: String
  city: String
  province: String
  zipcode: String!
  country: String!
  countryCode: String
}

input LocationWhereInput {
  organizationUniqueAlphanumericName: String
  locationIds: [String!]
  nameContains: String
  customTagIds: [String!]
  zoneIds: [String!]
  types: [LocationType!]
  searchBoundaries: PolygonInput
}

input MarketplaceLocationWhereInput {
  locationIds: [String!]
  nameContains: String
  customTagIds: [String!]
  zoneIds: [String!]
  searchBoundaries: PolygonInput
}

input OpeningHoursDetailsInput {
  closed: Boolean!
  openAllDay: Boolean!
  from: String
  until: String
}

input PeopleCapacityInput {

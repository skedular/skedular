schema {
  query: Query
  mutation: Mutation
}

type AreaRange {
  fromInSqm: String!
  toInSqm: String!
}

type CdnFile {
  url: String!
  height: Int
  width: Int
}

type CdnImageFile {
  original: CdnFile
  thumbnail: CdnFile
}

type ConnectionOfFloorPlanEdge {
  pageInfo: PageInfo!
  edges: [FloorPlanEdge!]!
  totalCount: Int
}

type ConnectionOfLocationEdge {
  pageInfo: PageInfo!
  edges: [LocationEdge!]!
  totalCount: Int
}

type ConnectionOfResourceEdge {
  pageInfo: PageInfo!
  edges: [ResourceEdge!]!
  totalCount: Int
}

type ContactDetails {
  contactPeople: [String!]
  contactEmails: [String!]
  contactPhones: [String!]
}

type DesksOccupancyPercentage {
  date: DateTime!
  percentage: Float!
}

type FloorPlanDetails {
  name: String!
  image: CdnImageFile!
  resourcePositions: [ResourcePositionDetails!]!
  resourceCount: Int!
  id: ID!
}

type FloorPlanEdge {
  node: FloorPlanDetails!
  cursor: String!
}

type FloorPlanPayload {
  clientMutationId: String
  floorPlan: FloorPlanDetails!
}

type LocationAnalytics {
  name: String!
  desksOccupancyPercentage: [DesksOccupancyPercentage!]!
  roomsOccupancyPercentage: [RoomsOccupancyPercentage!]!
  dailyBookingsTotals: [LocationDailyBookingsTotal!]!
}

type LocationDailyBookingsTotal {
  date: DateTime!
  total: Int!
}

type LocationDetails {
  name: String!
  about: String
  organization: Location_OrganizationDetails!
  timezone: String
  type: LocationTypeDetails!
  openingHours: OpeningHours!
  deskCapacity: Int!
  roomCapacity: Int!
  hasFutureBooking: Boolean!
  canModify: Boolean!
  canDelete: Boolean!
  canViewAnalytics: Boolean!
  resources: [ResourceDetails!]!
  physicalAddress: LocationPhysicalAddressDetails
  customTags: [Location_OrganizationTagDetails!]!
  zones: [Location_OrganizationTagDetails!]!
  resourceTypes: [Location_OrganizationTagDetails!]!
  locationTags: [Location_OrganizationTagDetails!]!
  primaryFeatureImage: CdnImageFile
  extraMetadata: LocationExtraMetadata
  locationSpaceTypes: [Location_OrganizationTagDetails!]!
  id: ID!
}

type LocationEdge {
  node: LocationDetails!
  cursor: String!
}

type LocationExtraMetadata {
  contactDetails: ContactDetails
  areaRange: AreaRange
  peopleCapacity: PeopleCapacity
  website: String
  relatedImageLinks: [String!]
  relatedVideoLinks: [String!]
  otherLinks: [String!]
}

type LocationPayload {
  clientMutationId: String
  location: LocationDetails!
}

type LocationPhysicalAddressDetails {
  osmType: String
  osmId: String
  placeId: String
  longitude: Float
  latitude: Float
  formattedAddress: String
  multilinesFormattedAddress: String
  addressLine1: String!
  addressLine2: String
  suburb: String
  city: String
  province: String
  zipcode: String!
  country: String!
  countryCode: String
  organization: LocationDetails!
  id: ID!
}

type LocationTypeDetails {
  type: LocationType!
  name: String!
}

type Location_OrganizationDetails {
  uniqueId: ID!
  uniqueAlphanumericName: String
  name: String!
  logoUrl: String
}

type Location_OrganizationTagDetails {
  uniqueId: ID!
  name: String
  tagType: String
  color: String
}

type Mutation {
  addFloorPlan(input: AddFloorPlanInput!): FloorPlanPayload! @cost(weight: "10")
  updateFloorPlan(input: UpdateFloorPlanInput!): FloorPlanPayload! @cost(weight: "10")
  deleteFloorPlan(input: DeleteFloorPlanInput!): FloorPlanPayload! @cost(weight: "10")
  updateResourcePositions(input: UpdateResourcePositionsInput!): FloorPlanPayload! @cost(weight: "10")
  addLocation(input: AddLocationInput!): LocationPayload! @cost(weight: "10")
  updateLocation(input: UpdateLocationInput!): LocationPayload! @cost(weight: "10")
  deleteLocation(input: DeleteLocationInput!): LocationPayload! @cost(weight: "10")
  updateLocationOpeningHours(input: UpdateLocationOpeningHoursInput!): LocationPayload! @cost(weight: "10")
  addLocationPhysicalAddress(input: AddLocationPhysicalAddressInput!): LocationPayload! @cost(weight: "10")
  updateLocationPhysicalAddress(input: UpdateLocationPhysicalAddressInput!): LocationPayload! @cost(weight: "10")
  addResource(input: AddResourceInput!): ResourcePayload! @cost(weight: "10")
  updateResource(input: UpdateResourceInput!): ResourcePayload! @cost(weight: "10")
  deleteResource(input: DeleteResourceInput!): ResourcePayload! @cost(weight: "10")
  deleteResources(input: DeleteResourcesInput!): ResourcesPayload! @cost(weight: "10")
  activateResources(input: ActivateResourcesInput!): ResourcesPayload! @cost(weight: "10")
  deactivateResources(input: DeactivateResourcesInput!): ResourcesPayload! @cost(weight: "10")
  updateLocationResourceAvailableHours(input: UpdateLocationResourceAvailableHoursInput!): ResourcePayload! @cost(weight: "10")
}

type OpeningHours {
  weekOpeningHours: WeekOpeningHours!
  closedDates: [DateTime!]!
  datesWithVariedOpeningHours: [VariedDateOpeningHours!]!
}

type OpeningHoursDetails {
  closed: Boolean!
  openAllDay: Boolean!
  from: String
  until: String
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type PeopleCapacity {
  from: String!
  to: String!
}

type Query {
  floorPlan(id: String!): FloorPlanDetails @cost(weight: "10")
  floorPlans(after: String first: Int before: String last: Int where: FloorPlanWhereInput! orderBy: [FloorPlanOrderInput!]): ConnectionOfFloorPlanEdge! @cost(weight: "10")
  locationTypes: [LocationTypeDetails!]!
  location(id: String!): LocationDetails @cost(weight: "10")
  locations(after: String first: Int before: String last: Int where: LocationWhereInput! orderBy: [LocationOrderInput!]): ConnectionOfLocationEdge! @cost(weight: "10")
  marketplaceLocations(after: String first: Int before: String last: Int where: MarketplaceLocationWhereInput! orderBy: [LocationOrderInput!]): ConnectionOfLocationEdge! @cost(weight: "10")
  myLocations(organizationUniqueAlphanumericName: String): [LocationDetails!] @cost(weight: "10")
  locationAnalytics(locationId: String! from: DateTime! until: DateTime!): LocationAnalytics @cost(weight: "10")
  locationsAnalytics(from: DateTime! until: DateTime! where: LocationWhereInput! orderBy: [LocationOrderInput!]): [LocationAnalytics!]! @cost(weight: "10")
  resources(after: String first: Int before: String last: Int where: ResourceWhereInput! orderBy: [ResourceOrderInput!]): ConnectionOfResourceEdge! @cost(weight: "10")
  resource(id: String!): ResourceDetails @cost(weight: "10")
  locationVersion: Version!
  locationCustomerRecordSynced: Boolean! @cost(weight: "10")
}

type ResourceDetails {
  name: String!
  inactive: Boolean!
  requireBookingApproval: Boolean!
  color: String
  capacity: Int!
  customTags: [Location_OrganizationTagDetails!]!
  zones: [Location_OrganizationTagDetails!]!
  productTags: [Location_OrganizationTagDetails!]!
  resourceType: Location_OrganizationTagDetails!
  isAvailableHoursOverridden: Boolean!
  availableHours: OpeningHours
  id: ID!
}

type ResourceEdge {
  node: ResourceDetails!
  cursor: String!
}

type ResourcePayload {
  clientMutationId: String
  resource: ResourceDetails!
}

type ResourcePositionDetails {
  id: ID!
  x: Int!
  y: Int!
  resource: ResourceDetails!
}

type ResourcesPayload {
  clientMutationId: String
  resources: [ResourceDetails!]!
}

type RoomsOccupancyPercentage {
  date: DateTime!
  percentage: Float!
}

type VariedDateOpeningHours {
  date: DateTime!
  openingHoursDetails: OpeningHoursDetails!
}

type Version {
  major: Int!
  minor: Int!
  build: Int!
  revision: Int!
}

type WeekOpeningHours {
  monday: OpeningHoursDetails!
  tuesday: OpeningHoursDetails!
  wednesday: OpeningHoursDetails!
  thursday: OpeningHoursDetails!
  friday: OpeningHoursDetails!
  saturday: OpeningHoursDetails!
  sunday: OpeningHoursDetails!
}

input ActivateResourcesInput {
  clientMutationId: String
  ids: [String!]!
}

input AddFloorPlanInput {
  clientMutationId: String
  id: String
  locationId: String!
  name: String!
  image: CdnImageFileInput!
  resourcePositions: [ResourcePositionInput!]
}

input AddLocationInput {
  clientMutationId: String
  id: String
  name: String!
  about: String
  organizationId: String
  organizationUniqueAlphanumericName: String
  timezone: String
  type: LocationType!
  locationTagIds: [String!]!
  primaryFeatureImage: CdnImageFileInput
  physicalAddress: LocationPhysicalAddressInput
  extraMetadata: LocationExtraMetadataInput
  weekOpeningHours: WeekOpeningHoursInput

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Booking update - Skedular</title>
</head>
<body style="background:#f5f6fa; margin:0; padding:0; font-family:Helvetica, Arial, sans-serif; color:#222;">
<table cellpadding="0" cellspacing="0" role="presentation" style="background:#f5f6fa; padding:40px 16px;" width="100%">
    <tr>
        <td align="center">
            <table cellpadding="0" cellspacing="0" role="presentation"
                   style="background:#ffffff; border-radius:8px; box-shadow:0 2px 8px #e0e0e0; max-width:600px; width:100%;">
                <tr>
                    <td style="background:#1f2937; border-radius:8px 8px 0 0; padding:24px 32px;">
                        <div style="color:#ffffff; font-size:24px; font-weight:bold; letter-spacing:.2px;">
                            Skedular
                        </div>
                        <div style="color:#d1d5db; font-size:13px; margin-top:6px;">Booking update</div>
                    </td>
                </tr>
                <tr>
                    <td style="background:#4caf50; height:4px; line-height:4px; font-size:0;">&nbsp;</td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <p style="font-size:18px; line-height:1.5; margin:0 0 20px 0;">Hello {{RECIPIENT_NAME}},</p>
                        <p style="color:#4b5563; font-size:16px; line-height:1.6; margin:0 0 20px 0;">{{SUMMARY}}</p>
                        <table cellpadding="0" cellspacing="0" role="presentation"
                               style="background:#f0fdf4; border-left:4px solid #4caf50; margin:0 0 24px 0; width:100%;">
                            <tr>
                                <td style="color:#166534; font-size:15px; line-height:1.5; padding:14px 16px;">
                                    <strong>
                                        What
                                        you can do:
                                    </strong> Review the booking in Skedular and {{CUSTOMER_ACTION}}. If you
                                    did not make this change, no further action is needed.
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="border-top:1px solid #eef0f3; color:#9ca3af; font-size:13px; padding:20px 32px; text-align:center;">
                        Powered by Skedular
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>

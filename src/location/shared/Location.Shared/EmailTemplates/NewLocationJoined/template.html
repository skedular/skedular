<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Location has joined Skedular</title>
</head>
<body style="background:#f5f6fa; margin:0; padding:0; font-family: Helvetica, Arial, sans-serif;">
<table cellpadding="0" cellspacing="0"
       style="background:#f5f6fa; padding:40px 0; font-family: Helvetica, Arial, sans-serif;"
       width="100%">
    <tr>
        <td align="center">
            <table cellpadding="0" cellspacing="0"
                   style="background:#fff; border-radius:8px; box-shadow:0 2px 8px #e0e0e0; font-family: Helvetica, Arial, sans-serif;">
                <tr>
                    <td style="padding:0 32px; font-family: Helvetica, Arial, sans-serif;">
                        <p style="color:#222; margin:32px 0 0 0; font-family: Helvetica, Arial, sans-serif;">
                            Hi,<br><br>
                            A new location has joined Skedular.<br><br>

                            Location ID:<br>
                            {{LOCATION_ID}}<br><br>

                            Location Name:<br>
                            {{LOCATION_NAME}}<br><br>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px 32px; text-align:center; color:#bbb; font-size:0.9em; font-family: Helvetica, Arial, sans-serif;">
                        Powered by Skedular
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>

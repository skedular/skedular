mutation UpdateOrganization(
    $id: String!
    $fieldsToUpdate: [OrganizationPatchField!]!
    $name: String
    $website: String
) {
    updateOrganization(
        input: {
            id: $id
            fieldsToUpdate: $fieldsToUpdate
            name: $name
            website: $website
        }
    ) {
        organization {
            id
            name
            website
        }
    }
}

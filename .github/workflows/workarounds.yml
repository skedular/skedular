name: "workarounds"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - ".github/actions/**"
      - ".github/workflows/lint.yml"
      - ".github/workflows/workarounds.yml"
      - "src/shared/**"
      - "src/all-in-one/**"
      - "src/core/**"
      - "src/booking/**"
      - "src/customer/**"
      - "src/gateway/**"
      - "src/location/**"
      - "src/msteams/**"
      - "src/organization/**"
      - "src/slack/**"
      - "src/team/**"
      - "src/marketplace/**"
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/actions/**"
      - ".github/workflows/lint.yml"
      - ".github/workflows/workarounds.yml"
      - "src/shared/**"
      - "src/all-in-one/**"
      - "src/core/**"
      - "src/booking/**"
      - "src/customer/**"
      - "src/gateway/**"
      - "src/location/**"
      - "src/msteams/**"
      - "src/organization/**"
      - "src/slack/**"
      - "src/team/**"
      - "src/marketplace/**"

jobs:
  build-apis:
    name: "Build APIs"
    runs-on: self-hosted
    if: github.event.pull_request.draft == false
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    permissions: write-all

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Build, Test and Push Image - All APIs
        uses: "./.github/actions/build-test-push"
        with:
          dockerFilePath: ./src/all-in-one/AllApis/Dockerfile
          dockerBuildContextPath: .
          dockerRegistry: ghcr.io
          dockerRegistryUsername: ${{ github.actor }}
          dockerRegistryPassword: ${{ secrets.GITHUB_TOKEN }}
          dockerNamespace: unityhubio
          dockerRepository: allapis
          pushDockerImage: true

  build-processors:
    name: "Build Processors"
    runs-on: self-hosted
    if: github.event.pull_request.draft == false
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    permissions: write-all

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Build, Test and Push Image - All Processors
        uses: "./.github/actions/build-test-push"
        with:
          dockerFilePath: ./src/all-in-one/AllProcessors/Dockerfile
          dockerBuildContextPath: .
          dockerRegistry: ghcr.io
          dockerRegistryUsername: ${{ github.actor }}
          dockerRegistryPassword: ${{ secrets.GITHUB_TOKEN }}
          dockerNamespace: unityhubio
          dockerRepository: allprocessors
          pushDockerImage: true

  build-jobs:
    name: "Build Jobs"
    runs-on: self-hosted
    if: github.event.pull_request.draft == false
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    permissions: write-all

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Build, Test and Push Image - All Jobs
        uses: "./.github/actions/build-test-push"
        with:
          dockerFilePath: ./src/all-in-one/AllJobs/Dockerfile
          dockerBuildContextPath: .
          dockerRegistry: ghcr.io
          dockerRegistryUsername: ${{ github.actor }}
          dockerRegistryPassword: ${{ secrets.GITHUB_TOKEN }}
          dockerNamespace: unityhubio
          dockerRepository: alljobs
          pushDockerImage: true

  build-infra:
    name: "Build Infra"
    runs-on: self-hosted
    if: github.event.pull_request.draft == false
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    permissions: write-all

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Build, Test and Push Image - All Infra
        uses: "./.github/actions/build-test-push"
        with:
          dockerFilePath: ./src/all-in-one/AllInfra/Dockerfile
          dockerBuildContextPath: .
          dockerRegistry: ghcr.io
          dockerRegistryUsername: ${{ github.actor }}
          dockerRegistryPassword: ${{ secrets.GITHUB_TOKEN }}
          dockerNamespace: unityhubio
          dockerRepository: allinfra
          pushDockerImage: true

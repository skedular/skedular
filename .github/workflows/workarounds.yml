name: "workarounds"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - ".github/actions/**"
      - ".github/workflows/lint.yml"
      - ".github/workflows/workarounds.yml"
      - "shared/**"
      - "all-in-one/**"
      - "core/**"
      - "booking/**"
      - "customer/**"
      - "gateway/**"
      - "location/**"
      - "msteams/**"
      - "notification/**"
      - "organization/**"
      - "payment/**"
      - "slack/**"
      - "team/**"
      - "marketplace/**"
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/actions/**"
      - ".github/workflows/lint.yml"
      - ".github/workflows/workarounds.yml"
      - "shared/**"
      - "all-in-one/**"
      - "core/**"
      - "booking/**"
      - "customer/**"
      - "gateway/**"
      - "location/**"
      - "msteams/**"
      - "notification/**"
      - "organization/**"
      - "payment/**"
      - "slack/**"
      - "team/**"
      - "marketplace/**"

jobs:
  build-apis:
    name: "Build APIs"
    runs-on:
      - ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    permissions: write-all

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build, Test and Push Image - All APIs
        uses: "./.github/actions/build-test-push"
        with:
          dockerFilePath: ./all-in-one/AllApis/Dockerfile
          dockerBuildContextPath: .
          dockerRegistry: ghcr.io
          dockerRegistryUsername: ${{ github.actor }}
          dockerRegistryPassword: ${{ secrets.GITHUB_TOKEN }}
          dockerNamespace: unityhubio
          dockerRepository: allapis
          pushDockerImage: true

  build-processors:
    name: "Build Processors"
    runs-on:
      - ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    permissions: write-all

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build, Test and Push Image - All Processors
        uses: "./.github/actions/build-test-push"
        with:
          dockerFilePath: ./all-in-one/AllProcessors/Dockerfile
          dockerBuildContextPath: .
          dockerRegistry: ghcr.io
          dockerRegistryUsername: ${{ github.actor }}
          dockerRegistryPassword: ${{ secrets.GITHUB_TOKEN }}
          dockerNamespace: unityhubio
          dockerRepository: allprocessors
          pushDockerImage: true

  build-jobs:
    name: "Build Jobs"
    runs-on:
      - ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    permissions: write-all

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build, Test and Push Image - All Jobs
        uses: "./.github/actions/build-test-push"
        with:
          dockerFilePath: ./all-in-one/AllJobs/Dockerfile
          dockerBuildContextPath: .
          dockerRegistry: ghcr.io
          dockerRegistryUsername: ${{ github.actor }}
          dockerRegistryPassword: ${{ secrets.GITHUB_TOKEN }}
          dockerNamespace: unityhubio
          dockerRepository: alljobs
          pushDockerImage: true

  build-infra:
    name: "Build Infra"
    runs-on:
      - ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    permissions: write-all

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build, Test and Push Image - All Infra
        uses: "./.github/actions/build-test-push"
        with:
          dockerFilePath: ./all-in-one/AllInfra/Dockerfile
          dockerBuildContextPath: .
          dockerRegistry: ghcr.io
          dockerRegistryUsername: ${{ github.actor }}
          dockerRegistryPassword: ${{ secrets.GITHUB_TOKEN }}
          dockerNamespace: unityhubio
          dockerRepository: allinfra
          pushDockerImage: true

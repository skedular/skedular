name: "webapp-spaces-help"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - ".github/actions/**"
      - ".github/workflows/lint.yml"
      - ".github/workflows/webapp-spaces-help.yml"
      - "src/web/package.json"
      - "src/web/pnpm-lock.yaml"
      - "src/web/pnpm-workspace.yaml"
      - "src/web/apps/webapp-spaces-help/**"
      - "src/web/packages/**"
      - "src/web/infrastructure/**"
      - "src/shared/infrastructure/**"
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/actions/**"
      - ".github/workflows/lint.yml"
      - ".github/workflows/webapp-spaces-help.yml"
      - "src/web/package.json"
      - "src/web/pnpm-lock.yaml"
      - "src/web/pnpm-workspace.yaml"
      - "src/web/apps/webapp-spaces-help/**"
      - "src/web/packages/**"
      - "src/web/infrastructure/**"
      - "src/shared/infrastructure/**"

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    permissions: write-all

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Free disk space
        # Docker image builds can stress disk on ubuntu-latest.
        # Remove pre-installed toolchains (Android SDK, Haskell) to reclaim ~15 GB.
        # large-packages is intentionally disabled: it removes 'powershell' which wipes pwsh.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Build, Test and validate
        uses: "./.github/actions/build-test-push"
        with:
          dockerFilePath: ./src/web/apps/webapp-spaces-help/Dockerfile
          dockerBuildContextPath: .
          dockerRegistry: ghcr.io
          dockerRegistryUsername: ${{ github.actor }}
          dockerRegistryPassword: ${{ secrets.GITHUB_TOKEN }}
          dockerNamespace: unityhubio
          dockerRepository: webapp-spaces-help

      - name: Configure AWS credentials - staging
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.STAGING_AWS_GITHUB_ACTIONS_AWS_ASSUME_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Lint, Validate and Plan - staging
        uses: "./.github/actions/lint-validate-infrastructure"
        env:
          TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: ./src/web/apps/webapp-spaces-help/infrastructure/workspaces/staging
          componentName: "webapp-spaces-help"
          environment: staging

      - name: Configure AWS credentials - production
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PRODUCTION_AWS_GITHUB_ACTIONS_AWS_ASSUME_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Lint, Validate and Plan - production
        uses: "./.github/actions/lint-validate-infrastructure"
        env:
          TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: ./src/web/apps/webapp-spaces-help/infrastructure/workspaces/production
          componentName: "webapp-spaces-help"
          environment: production

  staging:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: "Deploy to staging"
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    permissions: write-all
    environment: staging
    needs:
      - build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.STAGING_AWS_GITHUB_ACTIONS_AWS_ASSUME_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Infrastructure
        uses: "./.github/actions/deploy-infrastructure"
        env:
          TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
        with:
          workingDirectory: ./src/web/apps/webapp-spaces-help/infrastructure/workspaces/staging

  production:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: "Deploy to production"
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    permissions: write-all
    environment: production
    needs:
      - staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PRODUCTION_AWS_GITHUB_ACTIONS_AWS_ASSUME_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Infrastructure
        uses: "./.github/actions/deploy-infrastructure"
        env:
          TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
        with:
          workingDirectory: ./src/web/apps/webapp-spaces-help/infrastructure/workspaces/production

networks:
  unityhubio_publicwebsite_dev_network:

volumes:
  db_dev:
  dev1_publicwebsite:

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${UNITYHUBIO_DEV_MARIADB_PASSWORD}
    ports:
      - 3307:3306
    volumes:
      - db_dev:/var/lib/mysql
    networks:
      - unityhubio_publicwebsite_dev_network

  dev1_publicwebsite_wordpress:
    image: wordpress:6
    restart: unless-stopped
    ports:
      - 8082:80
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ${UNITYHUBIO_DEV_MARIADB_PASSWORD}
      WORDPRESS_DB_NAME: dev1_publicwebsite
    volumes:
      - dev1_publicwebsite:/var/www/html
    networks:
      - unityhubio_publicwebsite_dev_network

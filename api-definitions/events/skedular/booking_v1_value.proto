syntax = "proto3";
package booking;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Api.Shared.Clients.Events.Skedular.Booking.V1.Value";

enum Type {
  BookingUpserted = 0;
  BookingDeleted = 1;
}

message Event {
  Metadata metadata = 1;
  Data data = 2;
}

message Metadata {
  string id = 1;
  string domainSource = 2;
  string appSource = 3;
  Type type = 4;
  google.protobuf.Timestamp time = 5;
  string correlationId = 6;
}

message Data { Booking booking = 1; }

message Booking {
  string id = 1;
  google.protobuf.Timestamp deletedAt = 2;
  string customerId = 3;
  string organizationId = 4;
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
  string notes = 7;
  string locationId = 8;
  repeated string deskIds = 9;
  string teamId = 10;
  repeated DeskBookingDetail deskBookingDetails = 11;
  BookingType type = 12;
}

enum BookingStatus {
  AwaitAcceptance = 0;
  Accepted = 1;
  Declined = 2;
}

enum BookingType
{
    WorkingFromHome = 0;
    WorkingFromOffice = 1;
    SickLeave = 2;
    AnnualLeave = 3;
    WellBeingLeave = 4;
    ClientOffices = 5;
    Vacation = 6;
    TravelingForWork = 7;
    NonWorkingDay = 8;
}

message DeskBookingDetail {
  string id = 1;
  string deskId = 2;
  BookingStatus status = 3;
}


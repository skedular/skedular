syntax = "proto3";
package booking;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Api.Shared.Clients.Events.Skedular.Booking.V1.Value";

enum Type {
  BookingUpserted = 0;
  BookingDeleted = 1;
}

message Event {
  Metadata metadata = 1;
  Data data = 2;
}

message Metadata {
  string id = 1;
  string domainSource = 2;
  string appSource = 3;
  Type type = 4;
  google.protobuf.Timestamp time = 5;
  string correlationId = 6;
}

message Data { Booking booking = 1; }

message Booking {
  string id = 1;
  google.protobuf.Timestamp deletedAt = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp until = 4;
  string notes = 5;
  BookingType type = 6;
  BookingStatus status = 7;
  bool isPaymentRequired = 8;
  repeated string involvedCustomerIds = 9;
  repeated string involvedOrganizationIds = 10;
  repeated string involvedLocationIds = 11;
  repeated string involvedTeamIds = 12;
  repeated Resource resources = 13;
  repeated BookingSchedule Schedules = 14;
  string paidByCustomerId = 15;
  string paidByOrganizationId = 16;
  string createdByCustomerId = 17;
  string lastModifiedByCustomerId = 18;
  string deletedByCustomerId = 19;
  repeated LineItem lineItems = 20;
  BookingCheckoutSession bookingCheckoutSession = 21;
}

enum BookingType
{
  WorkingFromHome = 0;
  WorkingFromOffice = 1;
  WorkingFromCoworkingSpace = 2;
  SickLeave = 3;
  AnnualLeave = 4;
  WellbeingLeave = 5;
  ClientOffice = 6;
  Vacation = 7;
  TravelingForWork = 8;
  NonWorkingDay = 9;
}

message Resource {
  string id = 1;
  repeated string customerIds = 2;
}

message BookingSchedule {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp until = 2;
}

enum BookingStatus {
  Pending = 0;
  Rejected = 1;
  Confirmed = 2;
  PaymentExpired = 3;
  PaymentRecordNeverCreated = 4;
}

message LineItem {
  string productVersionId = 1;
  int32 quantity = 2;
}

enum PaymentStatus {
  PaymentStatusNoPaymentRequired = 0;
  PaymentStatusPending = 1;
  PaymentStatusPaid = 2;
  PaymentStatusUnpaid = 3;
}

message BookingCheckoutSession {
  string id = 1;
  string checkoutUrl = 2;
  PaymentStatus paymentStatus = 3;
}

syntax = "proto3";
package marketplace;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Api.Shared.Clients.Events.Skedular.Marketplace.V1.Value";

enum Type {
  Type_ProductUpserted = 0;
  Type_ProductDeleted = 1;
}

message Event {
  Metadata metadata = 1;
  Data data = 2;
}

message Metadata {
  string id = 1;
  string domainSource = 2;
  string appSource = 3;
  Type type = 4;
  google.protobuf.Timestamp time = 5;
  string correlationId = 6;
}

message Data { 
  oneof payload {
    Product product = 1;
  }
}

message Product {
  string id = 1;
  google.protobuf.Timestamp deletedAt = 2;
  bool inactive = 3;
  string organizationId = 4;
  ProductVersion latestProductVersion = 5;
}

message ProductVersion {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  string priceUnit = 5;
  bool isPriceTaxInclusive = 6;
  string currency = 7;
  int32 minDurationMinutes = 8;
  int32 maxDurationMinutes = 9;
  bool bookAllLocationResources = 10;
  int32 numberOfResourcesToBook = 11;
  repeated string productTagIds = 12;
  repeated string locationTagIds = 13;
  repeated CdnImageFile featureImages = 14;
  int32 maxAllowedResourcesLockTimePaidViaCard = 15;
  int32 maxAllowedResourcesLockTimePaidViaBankTransfer = 16;
  repeated string acceptedBookingPaymentMethods = 17;
  repeated ProductVersionPricingOptions PricingOptions = 18; 
}

message CdnImageFile {
  CdnFile original = 1;
  CdnFile thumbnail = 2;
}

message CdnFile {
  string url = 1;
  int32 height = 2;
  int32 width = 3;
}

enum ProductVersionPricingCadence {
  ProductVersionPricingCadence_OneTimeV1 = 0;
  ProductVersionPricingCadence_PerMinuteV1 = 1;
  ProductVersionPricingCadence_DailyV1 = 2;
  ProductVersionPricingCadence_WeeklyV1 = 3;
  ProductVersionPricingCadence_MonthlyV1 = 4;
}

enum PaymentMethod {
  PaymentMethod_Card = 0;
  PaymentMethod_BankTransfer = 1;
}

enum Currency {
  Currency_Nzd = 0;
  Currency_Usd = 1;
}

message ProductVersionOneTimePricingV1 {
  int32 index = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  bool isTaxInclusive = 5;
  Currency currency = 6;
  repeated PaymentMethod acceptedBookingPaymentMethods = 7;
}

message ProductVersionPerMinutePricingV1 {
  int32 index = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  bool isTaxInclusive = 5;
  Currency currency = 6;
  repeated PaymentMethod acceptedBookingPaymentMethods = 7;
}

message ProductVersionDailyPricingV1 {
  int32 index = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  bool isTaxInclusive = 5;
  Currency currency = 6;
  repeated PaymentMethod acceptedBookingPaymentMethods = 7;
}

message ProductVersionWeeklyPricingV1 {
  int32 index = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  bool isTaxInclusive = 5;
  Currency currency = 6;
  repeated PaymentMethod acceptedBookingPaymentMethods = 7;
}

message ProductVersionMonthlyPricingV1 {
  int32 index = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  bool isTaxInclusive = 5;
  Currency currency = 6;
  repeated PaymentMethod acceptedBookingPaymentMethods = 7;
}

message ProductVersionPricingOptions {
  ProductVersionPricingCadence cadence = 1;
  ProductVersionOneTimePricingV1 OneTimeV1 = 2;
  ProductVersionPerMinutePricingV1 PerMinuteV1 = 3;
  ProductVersionDailyPricingV1 DailyV1 = 4;
  ProductVersionWeeklyPricingV1 WeeklyV1 = 5;
  ProductVersionMonthlyPricingV1 MonthlyV1 = 6;
}
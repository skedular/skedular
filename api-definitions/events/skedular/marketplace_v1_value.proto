syntax = "proto3";
package marketplace;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Api.Shared.Clients.Events.Skedular.Marketplace.V1.Value";

enum Type {
  ProductUpserted = 0;
  ProductDeleted = 1;
}

message Event {
  Metadata metadata = 1;
  Data data = 2;
}

message Metadata {
  string id = 1;
  string domainSource = 2;
  string appSource = 3;
  Type type = 4;
  google.protobuf.Timestamp time = 5;
  string correlationId = 6;
}

message Data { 
  oneof payload {
    Product product = 1;
  }
}

message Product {
  string id = 1;
  google.protobuf.Timestamp deletedAt = 2;
  bool inactive = 3;
  string organizationId = 4;
  ProductVersion latestProductVersion = 5;
}

message ProductVersion {
  string id = 1;
  string name = 2;
  string description = 3;
  string price = 4;
  string priceUnit = 5;
  string currency = 6;
  int32 minDurationMinutes = 7;
  int32 maxDurationMinutes = 8;
  bool bookAllLocationResources = 9;
  int32 recurrenceWindowDays = 10;
  bool requireConsecutiveDays = 11;
  int32 maxBookingSpreadDays = 12;
  int32 numberOfResourcesToBook = 13;
  repeated string productTagIds = 14;
  repeated string locationTagIds = 15;
  CdnImageFile primaryFeatureImage = 16;
  int32 maxAllowedResourcesLockTimePaidByCard = 17;
  int32 maxAllowedResourcesLockTimePaidThroughBankAccount = 18;
}

message CdnImageFile {
  CdnFile original = 1;
  CdnFile thumbnail = 2;
}

message CdnFile {
  string url = 1;
  int32 height = 2;
  int32 width = 3;
}

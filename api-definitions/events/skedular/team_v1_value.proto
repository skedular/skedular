syntax = "proto3";
package team;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Api.Shared.Clients.Events.Skedular.Team.V1.Value";

enum Type {
  Type_TeamUpserted = 0;
  Type_TeamDeleted = 1;
  Type_InvitationToJoinTeamUpserted = 2;
  Type_InvitationToJoinTeamDeleted = 3;
}

message Event {
  Metadata metadata = 1;
  Data data = 2;
}

message Metadata {
  string id = 1;
  string domainSource = 2;
  string appSource = 3;
  Type type = 4;
  google.protobuf.Timestamp time = 5;
  string correlationId = 6;
}

message Data { 
  oneof payload {
    Team team = 1;
    InvitationToJoinTeam invitationToJoinTeam = 2;
  }
}

message Team {
  string id = 1;
  google.protobuf.Timestamp deletedAt = 2;
  string name = 3;
  string about = 4;
  repeated TeamMember members = 5;
  string organizationId = 6;
  string timezone = 7;
  string primaryLocationId = 8;
  CdnImageFile primaryFeatureImage = 9;
}

enum Role {
  Role_Owner = 0;
  Rol_eAdministrator = 1;
  Role_Member = 2;
}
 
message TeamMember {
  string id = 1;
  Role role = 2;
  string customerId = 3;
  OrganizationMember organizationMember = 4;
  Status status = 5;
}

enum Status {
  Status_Active = 0;
  Status_Inactive = 1;
}

message OrganizationMember {
  string customerId = 1;
  string organizationMemberId = 2;
  string organizationId = 3;
}

message InvitationToJoinTeam {
  string id = 1;
  google.protobuf.Timestamp deletedAt = 2;
  string teamId = 3;
  string invitedById = 4;
  string inviteeId = 5;
}

message CdnImageFile {
  CdnFile original = 1;
  CdnFile thumbnail = 2;
}

message CdnFile {
  string url = 1;
  int32 height = 2;
  int32 width = 3;
}

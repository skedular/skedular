syntax = "proto3";
package organization;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Api.Shared.Clients.Events.Skedular.Organization.V1.Value";

enum Type {
  OrganizationUpserted = 0;
  OrganizationDeleted = 1;
  InvitationToJoinOrganizationUpserted = 2;
  InvitationToJoinOrganizationDeleted = 3;
  OrganizationOfferingUpdated = 4;
}

message Event {
  Metadata metadata = 1;
  Data data = 2;
}

message Metadata {
  string id = 1;
  string domainSource = 2;
  string appSource = 3;
  Type type = 4;
  google.protobuf.Timestamp time = 5;
  string correlationId = 6;
}

message Data {
  oneof payload {
    Organization organization = 1;
    InvitationToJoinOrganization invitationToJoinOrganization = 2;
    Offering offering = 3;
  }
}

message Organization {
  string id = 1;
  google.protobuf.Timestamp deletedAt = 2;
  string name = 3;
  string about = 4;
  string logoUrl = 5;
  string website = 6;
  repeated OrganizationMember members = 7;
  Offering Offering = 8;
  repeated string azureTenantIds = 9;
  repeated Tag tags = 10;
  OrganizationSsoSettings ssoSettings = 11;
  string type = 12;
  string memberVisibilityPolicy = 13;
  Address physicalAddress = 14;
  string contactEmail = 15;
  string contactPhone = 16;
  BillingDetails billingDetails = 17;
  StripeCustomer stripeCustomer = 18;
  repeated StripePaymentMethod stripePaymentMethods = 19;
  repeated StripeConnectAccount stripeConnectAccounts = 20;
}

enum Role {
  Owner = 0;
  Administrator = 1;
  Member = 2;
}

message OrganizationMember {
  string id = 1;
  string customerId = 2;
  Role role = 3;
  Status status = 4;
}

enum Status {
  Active = 0;
  Inactive = 1;
}

message Offering {
  string id = 1;
  string code = 2;
  google.protobuf.Timestamp start = 3;
  google.protobuf.Timestamp end = 4;
  bool autoRenew = 5;
  int32 unitPrice = 6;
  repeated string activeCustomerIds = 7;
  string organizationId = 8;
}

message Location { string id = 1; }

message InvitationToJoinOrganization {
  string id = 1;
  google.protobuf.Timestamp deletedAt = 2;
  string organizationId = 3;
  string invitedById = 4;
  string inviteeId = 5;
}

message Tag {
  string id = 1;
  string name = 2;
  string description = 3;
  string type = 4;
  string color = 5;
}

message OrganizationSsoSettings {
  string id = 1;
  string entityId = 2;
  string loginUrl = 3;
  string appFederationMetadataUrl = 4;
  bool isActive = 5;
}

message Address {
  string id = 1;
  string addressLine1 = 2;
  string addressLine2 = 3;
  string suburb = 4;
  string city = 5;
  string province = 6;
  string zipcode = 7;
  string country = 8;
}

message BillingDetails {
  string id = 1;
  string companyName = 2;
  string email = 3;
  string addressLine1 = 4;
  string addressLine2 = 5;
  string suburb = 6;
  string city = 7;
  string province = 8;
  string zipcode = 9;
  string country = 10;
}

message StripeCustomer {
  string id = 1;
  string stripeCustomerId = 2;
}

message StripePaymentMethod {
  string id = 1;
  string setupIntentId = 2;
}

message StripeConnectAccount {
  string id = 1;
  string stripeAccountId = 2;
  bool isDefault = 3;
}

syntax = "proto3";
package organization;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Api.Shared.Clients.Events.Skedular.Organization.V1";

enum Type {
  Type_OrganizationUpserted        = 0;
  Type_OrganizationDeleted         = 1;
  Type_OrganizationOfferingUpdated = 2;
}

message Event {
  Metadata metadata = 1;
  Data     data     = 2;
}

message Metadata {
  string                    id            = 1;
  string                    domainSource  = 2;
  string                    appSource     = 3;
  Type                      type          = 4;
  google.protobuf.Timestamp time          = 5;
  string                    correlationId = 6;
}

message Data {
  oneof payload {
    Organization organization = 1;
    Offering     offering     = 2;
  }
}

message Organization {
  string                      id                                  = 1;
  google.protobuf.Timestamp   deletedAt                           = 2;
  string                      customDomain                        = 3;
  string                      name                                = 4;
  string                      logoUrl                             = 5;
  string                      website                             = 6;
  repeated OrganizationMember members                             = 7;
  Offering                    offering                            = 8;
  repeated string             azureTenantIds                      = 9;
  repeated Tag                tags                                = 10;
  OrganizationSsoSettings     ssoSettings                         = 11;
  OrganizationTaxDetails      taxDetails                          = 12;
  OrganizationType            type                                = 13;
  string                      contactEmail                        = 14;
  string                      contactPhone                        = 15;
  PhysicalAddress             physicalAddress                     = 16;
  bool                        isOwnershipVerified                 = 17;
  bool                        hasAttachedPaymentMethod            = 18;
  repeated CdnImageFile       featureImages                       = 19;
  ListingMetadata             marketplaceListingMetadata          = 20;
  OrganizationBillingCycle    billingCycle                        = 21;
  string                      customerFacingTermsAndConditionsUrl = 22;
  repeated string             refundNotificationEmails            = 23;
}

enum OrganizationType {
  OrganizationType_Private     = 0;
  OrganizationType_Marketplace = 1;
  OrganizationType_Host        = 2;
}

enum OrganizationBillingCycle {
  OrganizationBillingCycle_Weekly      = 0;
  OrganizationBillingCycle_Fortnightly = 1;
  OrganizationBillingCycle_Monthly     = 2;
}

message OrganizationMember {
  string                   id         = 1;
  string                   customerId = 2;
  OrganizationMemberRole   role       = 3;
  OrganizationMemberStatus status     = 4;
}

enum OrganizationMemberRole {
  OrganizationMemberRole_Owner         = 0;
  OrganizationMemberRole_Administrator = 1;
  OrganizationMemberRole_Member        = 2;
}

enum OrganizationMemberStatus {
  OrganizationMemberStatus_Active   = 0;
  OrganizationMemberStatus_Inactive = 1;
}

message Offering {
  string                    id                        = 1;
  string                    code                      = 2;
  google.protobuf.Timestamp start                     = 3;
  google.protobuf.Timestamp end                       = 4;
  bool                      autoRenew                 = 5;
  optional int32            unitPrice                 = 6;
  repeated string           activeCustomerIds         = 7;
  string                    organizationId            = 8;
  Currency                  currency                  = 9;
  optional int32            purchasedUserCapacity     = 10;
  optional int32            purchasedLocationCapacity = 11;
  optional int32            purchasedTeamCapacity     = 12;
  optional int32            fixedPrice                = 13;
  string                    currentActiveUserCount    = 14;
  bool                      isInteractionAllowed      = 15;
  string                    entitlementReasonCode     = 16;
  google.protobuf.Timestamp spacesTrialStartedAt      = 17;
  google.protobuf.Timestamp spacesTrialEndsAt         = 18;
  bool                      spacesProductEnabled      = 19;
  google.protobuf.Timestamp spacesNextBillingAt       = 20;
  double                    hostCommissionPercentage  = 21;
}

message Tag {
  string id          = 1;
  string name        = 2;
  string description = 3;
  string type        = 4;
  string color       = 5;
}

message OrganizationSsoSettings {
  string id                       = 1;
  string entityId                 = 2;
  string loginUrl                 = 3;
  string appFederationMetadataUrl = 4;
  bool   isActive                 = 5;
}

message OrganizationTaxDetails {
  string id                = 1;
  string taxId             = 2;
  double taxRatePercentage = 3;
}

message PhysicalAddress {
  string      id               = 1;
  string      addressLine1     = 2;
  string      addressLine2     = 3;
  string      suburb           = 4;
  string      city             = 5;
  string      province         = 6;
  string      zipcode          = 7;
  string      country          = 8;
  string      countryCode      = 9;
  string      formattedAddress = 10;
  string      osmType          = 11;
  string      osmId            = 12;
  string      placeId          = 13;
  Coordinates coordinates      = 14;
}

message Coordinates {
  double longitude = 1;
  double latitude  = 2;
}

message CdnImageFile {
  CdnFile original  = 1;
  CdnFile thumbnail = 2;
}

message CdnFile {
  string url    = 1;
  int32  height = 2;
  int32  width  = 3;
}

message ListingMetadata {
  string          about            = 1;
  string          title            = 2;
  string          subTitle         = 3;
  repeated string includedFeatures = 4;
}

enum Currency {
  Currency_Nzd = 0;
  Currency_Usd = 1;
}

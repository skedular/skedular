syntax = "proto3";
package organization;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Api.Shared.Clients.Events.Skedular.Organization.V1.Value";

enum Type {
  Type_OrganizationUpserted        = 0;
  Type_OrganizationDeleted         = 1;
  Type_OrganizationOfferingUpdated = 2;
}

message Event {
  Metadata metadata = 1;
  Data     data     = 2;
}

message Metadata {
  string                    id            = 1;
  string                    domainSource  = 2;
  string                    appSource     = 3;
  Type                      type          = 4;
  google.protobuf.Timestamp time          = 5;
  string                    correlationId = 6;
}

message Data {
  oneof payload {
    Organization organization = 1;
    Offering     offering     = 2;
  }
}

message Organization {
  string                      id                         = 1;
  google.protobuf.Timestamp   deletedAt                  = 2;
  string                      uniqueAlphanumericName     = 3;
  string                      name                       = 4;
  ListingMetadata             listingMetadata            = 5;
  string                      logoUrl                    = 6;
  string                      website                    = 7;
  repeated OrganizationMember members                    = 8;
  Offering                    Offering                   = 9;
  repeated string             azureTenantIds             = 10;
  repeated Tag                tags                       = 11;
  OrganizationSsoSettings     ssoSettings                = 12;
  OrganizationTaxDetails      taxDetails                 = 13;
  OrganizationType            type                       = 14;
  string                      contactEmail               = 15;
  string                      contactPhone               = 16;
  PhysicalAddress             physicalAddress            = 17;
  bool                        isOwnershipVerified        = 18;
  bool                        hasAttachedPaymentMethod   = 19;
  repeated CdnImageFile       featureImages              = 20;
  ListingMetadata             marketplaceListingMetadata = 21;
}

enum OrganizationType {
  OrganizationType_Private     = 0;
  OrganizationType_Marketplace = 1;
  OrganizationType_Individual  = 2;
}

enum Role {
  Role_Owner         = 0;
  Role_Administrator = 1;
  Role_Member        = 2;
}

message OrganizationMember {
  string id         = 1;
  string customerId = 2;
  Role   role       = 3;
  Status status     = 4;
}

enum Status {
  Status_Active   = 0;
  Status_Inactive = 1;
}

message Offering {
  string                    id                = 1;
  string                    code              = 2;
  google.protobuf.Timestamp start             = 3;
  google.protobuf.Timestamp end               = 4;
  bool                      autoRenew         = 5;
  int32                     unitPrice         = 6;
  repeated string           activeCustomerIds = 7;
  string                    organizationId    = 8;
}

message Location { string id = 1; }

message Tag {
  string id          = 1;
  string name        = 2;
  string description = 3;
  string type        = 4;
  string color       = 5;
}

message OrganizationSsoSettings {
  string id                       = 1;
  string entityId                 = 2;
  string loginUrl                 = 3;
  string appFederationMetadataUrl = 4;
  bool   isActive                 = 5;
}

message OrganizationTaxDetails {
  string id                = 1;
  string taxId             = 2;
  double taxRatePercentage = 3;
}

message PhysicalAddress {
  string      id               = 1;
  string      addressLine1     = 2;
  string      addressLine2     = 3;
  string      suburb           = 4;
  string      city             = 5;
  string      province         = 6;
  string      zipcode          = 7;
  string      country          = 8;
  string      countryCode      = 9;
  string      formattedAddress = 10;
  string      osmType          = 11;
  string      osmId            = 12;
  string      placeId          = 13;
  Coordinates coordinates      = 14;
}

message Coordinates {
  double longitude = 1;
  double latitude  = 2;
}

message CdnImageFile {
  CdnFile original  = 1;
  CdnFile thumbnail = 2;
}

message CdnFile {
  string url    = 1;
  int32  height = 2;
  int32  width  = 3;
}

message ListingMetadata {
  string          about            = 1;
  string          title            = 2;
  string          subTitle         = 3;
  repeated string includedFeatures = 4;
}

syntax = "proto3";
package organizationmember;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Api.Shared.Clients.Events.Skedular.OrganizationMember.V1.Value";

enum Type {
  OrganizationMemberUpserted = 0;
  OrganizationMemberDeleted = 1;
}

message Event {
  Metadata metadata = 1;
  Data data = 2;
}

message Metadata {
  string id = 1;
  string domainSource = 2;
  string appSource = 3;
  Type type = 4;
  google.protobuf.Timestamp time = 5;
  string correlationId = 6;
}

message Data { 
  OrganizationMember organizationMember = 1;
}

message OrganizationMember {
  string id = 1;
  google.protobuf.Timestamp deletedAt = 2;
  string organizationId = 3;
  string customerId = 4;
  Role role = 5;
  Status status = 6;
}

enum Status {
  Active = 0;
  Inactive = 1;
}

enum Role {
  Owner = 0;
  Administrator = 1;
  Member = 2;
}

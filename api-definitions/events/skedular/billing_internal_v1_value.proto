syntax = "proto3";
package billinginternal;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Api.Shared.Clients.Events.Skedular.BillingInternal.V1.Value";

enum Type {
  GenerateOrganizationOfferingInvoice = 0; 
}

message Event {
  Metadata metadata = 1;
  string organizationOfferingId = 2;
}

message Metadata {
  string id = 1;
  string domainSource = 2;
  string appSource = 3;
  Type type = 4;
  google.protobuf.Timestamp time = 5;
  string correlationId = 6;
}

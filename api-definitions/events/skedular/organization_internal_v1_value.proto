syntax = "proto3";
package organizationinternal;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Api.Shared.Clients.Events.Skedular.OrganizationInternal.V1.Value";

enum Type {
  Type_RecordDailyMemberCount = 0;
  Type_StripeConnectAccountWebhookEventReceived = 1;
}

message Event {
  Metadata metadata = 1;
  oneof payload {
    string organizationId = 2;
    string stripeConnectAccountWebhookEventPayload = 4;
  }
}

message Metadata {
  string id = 1;
  string domainSource = 2;
  string appSource = 3;
  Type type = 4;
  google.protobuf.Timestamp time = 5;
  string correlationId = 6;
}

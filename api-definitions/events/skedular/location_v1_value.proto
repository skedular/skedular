syntax = "proto3";
package location;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Api.Shared.Clients.Events.Skedular.Location.V1.Value";

enum Type {
  Type_LocationUpserted = 0;
  Type_LocationDeleted  = 1;
}

message Event {
  Metadata metadata = 1;
  Data     data     = 2;
}

message Metadata {
  string                    id            = 1;
  string                    domainSource  = 2;
  string                    appSource     = 3;
  Type                      type          = 4;
  google.protobuf.Timestamp time          = 5;
  string                    correlationId = 6;
}

message Data {
  oneof payload {
    Location location = 1;
  }
}

message Location {
  string                    id              = 1;
  google.protobuf.Timestamp deletedAt       = 2;
  string                    name            = 3;
  ListingMetadata           listingMetadata = 4;
  string                    organizationId  = 5;
  string                    timezone        = 6;
  repeated Resource         resources       = 7;
  repeated string           tagIds          = 8;
  OpeningHours              openingHours    = 9;
  PhysicalAddress           physicalAddress = 10;
  repeated CdnImageFile     featureImages   = 11;
  LocationType              type            = 12;
}

enum LocationType {
  LocationType_Private     = 0;
  LocationType_Marketplace = 1;
}

message Resource {
  string          id                         = 1;
  string          name                       = 2;
  bool            inactive                   = 3;
  bool            requireBookingApproval     = 4;
  repeated string tagIds                     = 5;
  string          color                      = 6;
  bool            isAvailableHoursOverridden = 7;
  OpeningHours    availableHours             = 8;
  int32           capacity                   = 9;
}

message OpeningHours {
  WeekOpeningHours                   weekOpeningHours            = 1;
  repeated google.protobuf.Timestamp closedDates                 = 2;
  repeated VariedDateOpeningHours    DatesWithVariedOpeningHours = 3;
}

message WeekOpeningHours {
  OpeningHoursDetails monday    = 1;
  OpeningHoursDetails tuesday   = 2;
  OpeningHoursDetails wednesday = 3;
  OpeningHoursDetails thursday  = 4;
  OpeningHoursDetails friday    = 5;
  OpeningHoursDetails saturday  = 6;
  OpeningHoursDetails sunday    = 7;
}

message VariedDateOpeningHours {
  google.protobuf.Timestamp date                = 1;
  OpeningHoursDetails       openingHoursDetails = 2;
}

message OpeningHoursDetails {
  bool   closed     = 1;
  bool   openAllDay = 2;
  string from       = 3;
  string until      = 4;
}

message PhysicalAddress {
  string      id               = 1;
  string      addressLine1     = 2;
  string      addressLine2     = 3;
  string      suburb           = 4;
  string      city             = 5;
  string      province         = 6;
  string      zipcode          = 7;
  string      country          = 8;
  string      countryCode      = 9;
  string      formattedAddress = 10;
  string      osmType          = 11;
  string      osmId            = 12;
  string      placeId          = 13;
  Coordinates coordinates      = 14;
}

message Coordinates {
  double longitude = 1;
  double latitude  = 2;
}

message CdnImageFile {
  CdnFile original  = 1;
  CdnFile thumbnail = 2;
}

message CdnFile {
  string url    = 1;
  int32  height = 2;
  int32  width  = 3;
}

message ListingMetadata {
  string about      = 1;
  string mainHeader = 2;
  string subHeader  = 3;
}

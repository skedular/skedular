syntax = "proto3";
package location;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Api.Shared.Clients.Events.Skedular.Location.V1.Value";

enum Type {
  LocationUpserted = 0;
  LocationDeleted = 1;
  InvitationToJoinLocationUpserted = 2;
  InvitationToJoinLocationDeleted = 3;
}

message Event {
  Metadata metadata = 1;
  Data data = 2;
}

message Metadata {
  string id = 1;
  string domainSource = 2;
  string appSource = 3;
  Type type = 4;
  google.protobuf.Timestamp time = 5;
  string correlationId = 6;
}

message Data { 
  oneof payload {
    Location locationAfterState = 1;
    InvitationToJoinLocation invitationToJoinLocationAfterState = 2;
  }
}

message Location {
  string id = 1;
  google.protobuf.Timestamp deletedAt = 2;
  string name = 3;
  string about = 4;
  repeated Member members = 5;
  string organizationId = 6;
  string timezone = 7;
  repeated Desk desks = 8;
}

enum MembershipType {
  MembershipTypeOwner = 0;
  MembershipTypeAdministrator = 1;
  MembershipTypeMember = 2;
}

message Member {
  string id = 1;
  MembershipType membershipType = 2;
  string customerId = 3;
}

message Desk {
  string id = 1;
  string name = 2;
  bool deactivated = 3;
  bool requireBookingApproval = 4;
  repeated string deskTypeIds = 5;
  repeated string zoneIds = 6;
}

message InvitationToJoinLocation {
  string id = 1;
  google.protobuf.Timestamp deletedAt = 2;
  string locationId = 3;
  string invitedById = 4;
  string inviteeId = 5;
}

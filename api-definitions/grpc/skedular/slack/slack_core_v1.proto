syntax = "proto3";
package slack;

option csharp_namespace = "Api.Shared.Grpc.Skedular.Slack.Core.V1";

service SlackService {

  rpc GetVersion (VersionInput) returns (Version);
}

message VersionInput {
}

message Version {
  int32 major    = 1;
  int32 minor    = 2;
  int32 build    = 3;
  int32 revision = 4;
}

syntax = "proto3";
package notification;

option csharp_namespace = "Api.Shared.Services.Grpc.Skedular.Notification.V1";

service NotificationService {
    rpc GetVersion (VersionInput) returns (Version);
}

message VersionInput {
}

message Version {
    int32 major = 1;
    int32 minor = 2;
    int32 build = 3;
    int32 revision = 4;
}

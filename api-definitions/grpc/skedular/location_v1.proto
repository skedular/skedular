syntax = "proto3";
package location;

option csharp_namespace = "Api.Shared.Services.Grpc.Skedular.Location.V1";

service LocationService {
    rpc Admin_Add (Admin_AddInput) returns (Location);
    rpc Admin_GetPaginatedLocations (Admin_GetPaginatedLocationsInput) returns (LocationConnection);
    rpc Admin_Get (Admin_GetInput) returns (Location);

    rpc GetVersion (VersionInput) returns (Version);
    rpc Get (GetInput) returns (Location);
    rpc GetPaginatedLocations (GetPaginatedLocationsInput) returns (LocationConnection);
    rpc GetPermissions (GetPermissionsInput) returns (Permissions);
    rpc Add (AddInput) returns (Location);
    rpc Update (UpdateInput) returns (Location);
    rpc Remove (RemoveInput) returns (Location);

    rpc GetPaginatedResources (GetPaginatedResourcesInput) returns (ResourceConnection);
    rpc GetResource (GetResourceInput) returns (Resource);
    rpc AddResource (AddResourceInput) returns (Resource);
    rpc UpdateResource (UpdateResourceInput) returns (Resource);
    rpc RemoveResource (RemoveResourceInput) returns (Resource);

    rpc GetPaginatedDesks (GetPaginatedDesksInput) returns (DeskConnection);
    rpc GetDesk (GetDeskInput) returns (Desk);
    rpc AddDesk (AddDeskInput) returns (Desk);
    rpc BulkAddDesks (BulkAddDesksInput) returns (BulkAddDesksResponse);
    rpc UpdateDesk (UpdateDeskInput) returns (Desk);
    rpc RemoveDesk (RemoveDeskInput) returns (Desk);

    rpc GetPaginatedRooms (GetPaginatedRoomsInput) returns (RoomConnection);
    rpc GetRoom (GetRoomInput) returns (Room);
    rpc AddRoom (AddRoomInput) returns (Room);
    rpc UpdateRoom (UpdateRoomInput) returns (Room);
    rpc RemoveRoom (RemoveRoomInput) returns (Room);
}

message VersionInput {
}

message Version {
    int32 major = 1;
    int32 minor = 2;
    int32 build = 3;
    int32 revision = 4;
}

enum OrderDirection {
    Ascending = 0;
    Descending = 1;
}

message PageInfo {
    bool hasNextPage = 1;
    bool hasPreviousPage =2;
    string startCursor =3;
    string endCursor =4;
}

enum Role {
    Owner = 0;
    Administrator = 1;
    Member = 2;
}

message LocationMember {
    string id = 1;
    Customer customer = 2;
    Role role = 3;
}

message Customer {
    string id = 1;
    string name = 2;
    string givenName = 3;
    string middleName = 4;
    string familyName = 5;
    string photoUrl = 6;
    string photoUrl24 = 7;
    string photoUrl32 = 8;
    string photoUrl48 = 9;
    string photoUrl72 = 10;
    string photoUrl192 = 11;
    string photoUrl512 = 12;
    repeated Identity identities = 13;
}

message Identity {
    string id = 1;
    string email = 2;
    bool emailVerified = 3;
}

message Admin_AddInput {
    string id = 1;
    string name = 2;
    string about = 3;
    string organizationId = 4;
    string timezone = 5;
}

message LocationConnection {
    PageInfo pageInfo = 1;
    repeated LocationEdge edges = 2;
    int32 totalCount = 3;
}

message LocationEdge {
    Location node = 1;
    string cursor = 2;
}

message Location {
    string id = 1;
    string name = 2;
    string about = 3;
    string organizationId = 4;
    string timezone = 5;
    repeated Resource resources = 6;
    repeated Desk desks = 7;
    repeated Room rooms = 8;
    bool hasFutureBooking = 9;
    Permissions permissions = 10;
    repeated LocationMember members = 11;
    repeated OrganizationCustomTag customTags = 12;
    repeated OrganizationZone zones = 13;
}

message Admin_GetInput {
    string id = 1;
}

message GetInput {
    string id = 1;
}

message Admin_GetPaginatedLocationsInput {
    string after = 1;
    int32 first = 2;
    string before = 3;
    int32 last = 4;
    LocationWhereInput where = 5;
    repeated LocationOrderInput orderBy = 6;
}

message GetPaginatedLocationsInput {
    string after = 1;
    int32 first = 2;
    string before = 3;
    int32 last = 4;
    LocationWhereInput where = 5;
    repeated LocationOrderInput orderBy = 6;
}

message LocationWhereInput {
    string organizationId = 1;
    repeated string locationIds = 2;
    string nameContains = 3;
    repeated string tagIds = 4;
}

message LocationOrderInput {
    OrderDirection direction = 1;
    LocationOrderField field = 2;
}

enum LocationOrderField {
    Name = 0;
    About = 1;
    Timezone = 2;
}

message OrganizationCustomTag {
    string id = 1;
    string name = 2;
    string color = 3;
}

message OrganizationZone {
    string id = 1;
    string name = 2;
    string color = 3;
}

message GetPermissionsInput {
    string id = 1;
}

message Permissions {
    bool canView = 1;
    bool canModify = 2;
    bool canDelete = 3;
    bool canInvitePeople = 4;
    bool canCancelPeopleExistingInvitations = 5;
    bool canViewAnalytics = 6;
}

message AddInput {
    string id = 1;
    string name = 2;
    string about = 3;
    string organizationId = 4;
    string timezone = 5;
}

message UpdateInput {
    string id = 1;
    string name = 2;
    string about = 3;
    string organizationId = 4;
    string timezone = 5;
}

message RemoveInput {
    string id = 1;
}

message Resource {
    string id = 1;
    string name = 2;
    bool inactive = 3;
    bool requireBookingApproval = 4;
    repeated OrganizationCustomTag organizationCustomTags = 5;
    repeated OrganizationZone organizationZones = 6;
    string color = 7;
}

message ResourceConnection {
    PageInfo pageInfo = 1;
    repeated ResourceEdge edges = 2;
    int32 totalCount = 3;
}

message ResourceEdge {
    Resource node = 1;
    string cursor = 2;
}

message GetPaginatedResourcesInput {
    string after = 1;
    int32 first = 2;
    string before = 3;
    int32 last = 4;
    ResourceWhereInput where = 5;
    repeated ResourceOrderInput orderBy = 6;
}

message ResourceWhereInput {
    string locationId = 1;
    string nameContains = 2;
    repeated string tagIds = 3;
}

message ResourceOrderInput {
    OrderDirection direction = 1;
    ResourceOrderField field = 2;
}

enum ResourceOrderField {
    ResourceName = 0;
}

message GetResourceInput {
    string id = 1;
}

message AddResourceInput {
    string id = 1;
    string locationId = 2;
    string name = 3;
    bool inactive = 4;
    bool requireBookingApproval = 5;
    repeated string tagIds = 6;
    string color = 7;
}

message UpdateResourceInput {
    string id = 1;
    string name = 2;
    bool inactive = 3;
    bool requireBookingApproval = 4;
    repeated string tagIds = 5;
    string color = 6;
}

message RemoveResourceInput {
    string id = 1;
}

message Desk {
    string id = 1;
    string name = 2;
    bool deactivated = 3;
    bool requireBookingApproval = 4;
    repeated OrganizationCustomTag organizationCustomTags = 5;
    repeated OrganizationZone organizationZones = 6;
    string color = 7;
}

message DeskConnection {
    PageInfo pageInfo = 1;
    repeated DeskEdge edges = 2;
    int32 totalCount = 3;
}

message DeskEdge {
    Desk node = 1;
    string cursor = 2;
}

message GetPaginatedDesksInput {
    string after = 1;
    int32 first = 2;
    string before = 3;
    int32 last = 4;
    DeskWhereInput where = 5;
    repeated DeskOrderInput orderBy = 6;
}

message DeskWhereInput {
    string locationId = 1;
    string nameContains = 2;
    repeated string tagIds = 3;
}

message DeskOrderInput {
    OrderDirection direction = 1;
    DeskOrderField field = 2;
}

enum DeskOrderField {
    DeskName = 0;
}

message GetDeskInput {
    string id = 1;
}

message BulkAddDesksInput {
    string id = 1;
    string locationId = 2;
    string namePrefix = 3;
    int32 count = 4;
    bool deactivated = 5;
    bool requireBookingApproval = 6;
    repeated string tagIds = 7;
    string color = 8;
}

message BulkAddDesksResponse {
    repeated Desk desks = 1;
}

message AddDeskInput {
    string id = 1;
    string locationId = 2;
    string name = 3;
    bool deactivated = 4;
    bool requireBookingApproval = 5;
    repeated string tagIds = 6;
    string color = 7;
}

message UpdateDeskInput {
    string id = 1;
    string name = 2;
    bool deactivated = 3;
    bool requireBookingApproval = 4;
    repeated string tagIds = 5;
    string color = 6;
}

message RemoveDeskInput {
    string id = 1;
}

message Room {
    string id = 1;
    string name = 2;
    bool deactivated = 3;
    bool requireBookingApproval = 4;
    repeated OrganizationCustomTag organizationCustomTags = 5;
    repeated OrganizationZone organizationZones = 6;
    string color = 7;
}

message RoomConnection {
    PageInfo pageInfo = 1;
    repeated RoomEdge edges = 2;
    int32 totalCount = 3;
}

message RoomEdge {
    Room node = 1;
    string cursor = 2;
}

message GetPaginatedRoomsInput {
    string after = 1;
    int32 first = 2;
    string before = 3;
    int32 last = 4;
    RoomWhereInput where = 5;
    repeated RoomOrderInput orderBy = 6;
}

message RoomWhereInput {
    string locationId = 1;
    string nameContains = 2;
    repeated string tagIds = 3;
}

message RoomOrderInput {
    OrderDirection direction = 1;
    RoomOrderField field = 2;
}

enum RoomOrderField {
    RoomName = 0;
}

message GetRoomInput {
    string id = 1;
}

message AddRoomInput {
    string id = 1;
    string locationId = 2;
    string name = 3;
    bool deactivated = 4;
    bool requireBookingApproval = 5;
    repeated string tagIds = 6;
    string color = 7;
}

message UpdateRoomInput {
    string id = 1;
    string name = 2;
    bool deactivated = 3;
    bool requireBookingApproval = 4;
    repeated string tagIds = 5;
    string color = 6;
}

message RemoveRoomInput {
    string id = 1;
}

syntax = "proto3";
package customer;

option csharp_namespace = "Api.Shared.Grpc.Skedular.Customer.Graphql.V1";

service CustomerGraphqlService {
  rpc RaiseGraphqlChange (RaiseGraphqlChangeInput) returns (RaiseGraphqlChangeResponse);
}

message RaiseGraphqlChangeInput {
  string topicName = 1;
  string id        = 2;
}

message RaiseGraphqlChangeResponse {
}

syntax = "proto3";
package msteams;

option csharp_namespace = "Api.Shared.Grpc.Skedular.MsTeams.Graphql.V1";

service MsTeamsGraphqlService {
  rpc RaiseGraphqlChange (RaiseGraphqlChangeInput) returns (RaiseGraphqlChangeResponse);
}

message RaiseGraphqlChangeInput {
  string topicName = 1;
  string id        = 2;
}

message RaiseGraphqlChangeResponse {
}

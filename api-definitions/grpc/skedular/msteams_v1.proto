syntax = "proto3";
package msteams;

option csharp_namespace = "Api.Shared.Services.Grpc.Skedular.MsTeams.V1";

service MsTeamsService {
  rpc RaiseGraphqlChange (RaiseGraphqlChangeInput) returns (RaiseGraphqlChangeResponse);

  rpc GetVersion (VersionInput) returns (Version);
}

message RaiseGraphqlChangeInput {
  string topicName = 1;
  string id        = 2;
}

message RaiseGraphqlChangeResponse {
}

message VersionInput {
}

message Version {
  int32 major    = 1;
  int32 minor    = 2;
  int32 build    = 3;
  int32 revision = 4;
}

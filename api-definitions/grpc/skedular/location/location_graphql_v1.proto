syntax = "proto3";
package location;

option csharp_namespace = "Api.Shared.Grpc.Skedular.Location.Graphql.V1";

service LocationGraphqlService {
  rpc RaiseGraphqlChange (RaiseGraphqlChangeInput) returns (RaiseGraphqlChangeResponse);
}

message RaiseGraphqlChangeInput {
  string topicName = 1;
  string id        = 2;
}

message RaiseGraphqlChangeResponse {
}

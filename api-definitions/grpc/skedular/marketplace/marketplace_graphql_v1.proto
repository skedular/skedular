syntax = "proto3";
package marketplace;

option csharp_namespace = "Api.Shared.Grpc.Skedular.Marketplace.Graphql.V1";

service MarketplaceGraphqlService {
  rpc RaiseGraphqlChange (RaiseGraphqlChangeInput) returns (RaiseGraphqlChangeResponse);
}

message RaiseGraphqlChangeInput {
  string topicName = 1;
  string id        = 2;
}

message RaiseGraphqlChangeResponse {
}

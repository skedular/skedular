syntax = "proto3";
package marketplace;

option csharp_namespace = "Api.Shared.Grpc.Skedular.Marketplace.Core.V1";

service MarketplaceService {

  rpc GetVersion (VersionInput) returns (Version);
  rpc EnsureHostLocationDraftProduct (EnsureHostLocationDraftProductInput) returns (HostLocationProduct);
  rpc RemoveHostLocationDraftProduct (RemoveHostLocationDraftProductInput) returns (HostLocationProduct);
}

message EnsureHostLocationDraftProductInput {
  string id = 1;
  string organizationId = 2;
  string productTagId = 3;
  string locationName = 4;
}

message RemoveHostLocationDraftProductInput {
  string id = 1;
  string organizationId = 2;
}

message HostLocationProduct {
  string id = 1;
  bool inactive = 2;
}

message VersionInput {
}

message Version {
  int32 major    = 1;
  int32 minor    = 2;
  int32 build    = 3;
  int32 revision = 4;
}

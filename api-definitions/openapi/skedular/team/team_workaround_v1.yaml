openapi: 3.1.1
info:
  title: Team Workaround API v1
  description: "Team Workaround REST API"
  version: 1.0.0

servers:
  - url: https://api.skedular.app
    description: production
  - url: https://apistaging.skedular.app
    description: staging
  - url: http://localhost:9000
    description: local gateway
  - url: http://localhost:10500
    description: local

paths:
  /v1/team/{teamId}/republish:
    put:
      tags:
        - v1
        - team
        - workaround
      summary: republish team
      operationId: republish
      parameters:
        - in: path
          name: teamId
          schema:
            type: string
          required: true

      responses:
        "200":
          description: the status of team republishing

        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/team/republish-all:
    put:
      tags:
        - v1
        - team
        - workaround
      summary: republish all teams
      operationId: republishAll

      responses:
        "200":
          description: the status of team republishing

        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: { }
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string

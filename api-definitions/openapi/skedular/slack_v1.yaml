openapi: 3.1.1
info:
  title: slack API v1
  description: "slack REST API"
  version: 1.0.0

paths:
  /slack/api/v1/callback:
    get:
      tags:
        - slack
      summary: slack installation callback
      operationId: callback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string

      responses:
        "200":
          description: the response

        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
        message:
          type: string
          description: Error message

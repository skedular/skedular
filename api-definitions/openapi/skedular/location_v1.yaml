openapi: 3.1.1
info:
  title: Location API v1
  description: "Location REST API"
  version: 1.0.0

paths:
  /location/api/v1/{locationId}/republish:
    put:
      tags:
        - location
      summary: republish location
      operationId: republish
      parameters:
        - in: path
          name: locationId
          schema:
            type: string
          required: true

      responses:
        "200":
          description: the status of location republishing

        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /location/api/v1/republish-all:
    put:
      tags:
        - location
      summary: republish all locations
      operationId: republishAll

      responses:
        "200":
          description: the status of location republishing

        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
        message:
          type: string
          description: Error message

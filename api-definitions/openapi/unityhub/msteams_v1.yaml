openapi: 3.1.0
info:
  title: MSTeams API v1
  description: "MSTeams REST API"
  version: 1.0.0

paths:
  /msteams/api/v1/adminconsenturl:
    get:
      tags:
        - msteams
      summary: generate an admin consent Url for the given tenant
      operationId: adminConsentUrl
      responses:
        "302":
          description: redirect status response code

  /msteams/api/v1/onboard-tenant:
    get:
      tags:
        - msteams
      summary: OnBoard a tenant
      operationId: onBoardTenant
      parameters:
        - in: query
          name: tenant
          schema:
            type: string
          required: true
        - in: query
          name: admin_consent
          schema:
            type: boolean
          required: true
        - in: query
          name: state
          schema:
            type: string
          required: true
        - in: query
          name: error
          schema:
            type: string
        - in: query
          name: error_description
          schema:
            type: string

      responses:
        "200":
          description: on boarding response

components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
        message:
          type: string
          description: Error message

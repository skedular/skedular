openapi: 3.1.0
info:
  title: Billing API v1
  description: "Billing REST API"
  version: 1.0.0

paths:
  /billing/api/v1/republish-organization-billing-info/{organizationId}:
    put:
      tags:
        - billing
        - organization
      summary: republish organization billing info
      operationId: republishOrganizationBillingInfo
      parameters:
        - in: path
          name: organizationId
          schema:
            type: string
          required: true

      responses:
        "200":
          description: the status of organization republishing

        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /billing/api/v1/republish-all-organizations-billing-info:
    put:
      tags:
        - billing
        - organization
      summary: republish all organizations billing info
      operationId: republishAllOrganizationsBillingInfo

      responses:
        "200":
          description: the status of organization republishing

        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
        message:
          type: string
          description: Error message

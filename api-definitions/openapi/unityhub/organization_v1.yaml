openapi: 3.1.0
info:
  title: Organization API v1
  description: "Organization REST API"
  version: 1.0.0

paths:
  /organization/api/v1/{organizationId}/republish:
    put:
      tags:
        - organization
      summary: republish organization
      operationId: republish
      parameters:
        - in: path
          name: organizationId
          schema:
            type: string
          required: true

      responses:
        "200":
          description: the status of organization republishing

        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /organization/api/v1/republish-all:
    put:
      tags:
        - organization
      summary: republish all organizations
      operationId: republishAll

      responses:
        "200":
          description: the status of organization republishing

        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
        message:
          type: string
          description: Error message

  azureTenantOrganization: OrganizationDetails
  deskTypes(after: String first: Int before: String last: Int where: DeskTypeOrganizationTagWhereInput! orderBy: [OrganizationTagOrderInput!]): OrganizationTagConnection
  zones(after: String first: Int before: String last: Int where: ZoneOrganizationTagWhereInput! orderBy: [OrganizationTagOrderInput!]): OrganizationTagConnection

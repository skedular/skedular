  myOrganizations: [OrganizationDetails!]
  organizationMembers(after: String first: Int before: String last: Int where: OrganizationMemberWhereInput! orderBy: [OrganizationMemberOrderInput!]): OrganizationMemberConnection
  organizationAnalytics(organizationId: String! from: DateTime! until: DateTime!): OrganizationAnalytics
  isAzureTenantInstalled: Boolean!

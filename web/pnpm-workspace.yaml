packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@mui/x-telemetry': true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@types/react@19.2.15'
  - react-svg-credit-card-payment-icons@6.0.3
  - '@vitest/expect@4.1.7'
  - '@vitest/mocker@4.1.7'
  - '@vitest/pretty-format@4.1.7'
  - '@vitest/runner@4.1.7'
  - '@vitest/snapshot@4.1.7'
  - '@vitest/spy@4.1.7'
  - '@vitest/utils@4.1.7'
  - vitest@4.1.7
  - '@mui/x-charts@9.3.0'
  - '@mui/x-data-grid-premium@9.3.0'
  - '@mui/x-data-grid-pro@9.3.0'
  - '@mui/x-data-grid@9.3.0'
  - '@mui/x-date-pickers-pro@9.3.0'
  - '@mui/x-date-pickers@9.3.0'
  - '@mui/x-internal-gestures@9.3.0'
  - '@mui/x-tree-view-pro@9.3.0'
  - '@mui/x-virtualizer@9.0.0-alpha.7'
overrides:
  '@types/node': 25.9.0
patchedDependencies:
  globalize@1.7.1: patches/globalize@1.7.1.patch
  nextra-theme-docs@4.6.1: patches/nextra-theme-docs@4.6.1.patch

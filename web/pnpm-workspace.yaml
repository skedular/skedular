packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@mui/x-telemetry': true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@stripe/react-stripe-js@6.4.0'
  - '@stripe/stripe-js@9.6.0'
  - '@types/node@25.9.0'
  - date-fns@4.2.1
  - react-relay@21.0.0
  - relay-compiler@21.0.0
  - relay-runtime@21.0.0
patchedDependencies:
  globalize@1.7.1: patches/globalize@1.7.1.patch

  - '@stripe/stripe-js@9.6.0'
  - '@types/node@25.9.0'
  - date-fns@4.2.1
  - react-relay@21.0.0
  - relay-compiler@21.0.0
  - relay-runtime@21.0.0
  - '@types/node@25.9.1'
  - '@types/react@19.2.15'
  - react-svg-credit-card-payment-icons@6.0.3
patchedDependencies:
  globalize@1.7.1: patches/globalize@1.7.1.patch
  nextra-theme-docs@4.6.1: patches/nextra-theme-docs@4.6.1.patch

type Query {
  bookingCategories: [BookingCategoryDetails!]!
  marketplaceBookingCategories: [BookingCategoryDetails!]!
  booking(id: String!): BookingDetails @cost(weight: "10")
  bookingById(id: String!): BookingDetails @lookup @internal @cost(weight: "10")
  bookings(after: String first: Int before: String last: Int where: BookingWhereInput! orderBy: [BookingOrderInput!]): ConnectionOfBookingEdge! @cost(weight: "10")
  allBookings(where: BookingWhereInput!): [BookingDetails!]! @cost(weight: "10")
  marketplaceBookingSubscription(id: String!): MarketplaceBookingSubscriptionDetails @cost(weight: "10")
  marketplaceBookingSubscriptionById(id: String!): MarketplaceBookingSubscriptionDetails @lookup @internal @cost(weight: "10")
  marketplaceBookingSubscriptions(after: String first: Int before: String last: Int where: MarketplaceBookingSubscriptionWhereInput! orderBy: [MarketplaceBookingSubscriptionOrderInput!]): ConnectionOfMarketplaceBookingSubscriptionEdge! @cost(weight: "10")
  allMarketplaceBookingSubscriptions(where: MarketplaceBookingSubscriptionWhereInput!): [MarketplaceBookingSubscriptionDetails!]! @cost(weight: "10")
  paymentMethodTypes: [PaymentMethodTypeDetails!]!
  paymentStatuses: [PaymentStatusDetails!]!
  organizationBookingPermissions(organizationId: String organizationUniqueAlphanumericName: String): OrganizationBookingPermissions! @cost(weight: "10")
  teamBookingPermissions(teamId: String!): TeamBookingPermissions! @cost(weight: "10")
  recurringBooking(id: String!): RecurringBookingDetails @cost(weight: "10")
  recurringBookingById(id: String!): RecurringBookingDetails @lookup @internal @cost(weight: "10")
  recurringBookings(after: String first: Int before: String last: Int where: RecurringBookingWhereInput! orderBy: [RecurringBookingOrderInput!]): ConnectionOfRecurringBookingEdge! @cost(weight: "10")
  allRecurringBookings(where: RecurringBookingWhereInput!): [RecurringBookingDetails!]! @cost(weight: "10")
  availableResources(where: AvailableResourcesWhereInput!): [BookingResourceDetails!]! @cost(weight: "10")
  availableResourcesCount(where: AvailableResourcesCountWhereInput!): Int! @cost(weight: "10")
  organizationResourcesAvailability(where: OrganizationAvailableResourcesWhereInput!): OrganizationAvailableResources! @cost(weight: "10")
  bookingVersion: Version!
  bookingCustomerRecordSynced: Boolean! @cost(weight: "10")
}


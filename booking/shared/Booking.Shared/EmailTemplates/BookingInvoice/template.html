<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice #{{INVOICE_NUMBER}} from {{COMPANY_NAME}}</title>
</head>
<body style="background:#f5f6fa; margin:0; padding:0; font-family: Helvetica, Arial, sans-serif;">
<table cellpadding="0" cellspacing="0" style="background:#f5f6fa; padding:40px 0; font-family: Helvetica, Arial, sans-serif;"
       width="100%">
    <tr>
        <td align="center">
            <table cellpadding="0" cellspacing="0" style="background:#fff; border-radius:8px; box-shadow:0 2px 8px #e0e0e0; font-family: Helvetica, Arial, sans-serif;"
                   width="600">
                <tr>
                    <td style="padding:32px 32px 16px 32px; text-align:center; font-family: Helvetica, Arial, sans-serif;">
                        <h2 style="margin:0; color:#222; font-family: Helvetica, Arial, sans-serif;">
                            {{COMPANY_NAME}}</h2>
                        <p style="margin:8px 0 0 0; color:#888; font-family: Helvetica, Arial, sans-serif;">Invoice
                            #{{INVOICE_NUMBER}}</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 32px; font-family: Helvetica, Arial, sans-serif;">
                        <p style="color:#222; margin:32px 0 0 0; font-family: Helvetica, Arial, sans-serif;">
                            Hi {{RECIPIENT_NAME}},<br><br>
                            Please find your invoice <b>#{{INVOICE_NUMBER}}</b> attached to this email.<br>
                            If you have any questions, please contact us.<br><br>
                            Thanks,<br>
                            {{COMPANY_NAME}}
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px 32px; text-align:center; color:#bbb; font-size:0.9em; font-family: Helvetica, Arial, sans-serif;">
                        Powered by Your Skedular
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>

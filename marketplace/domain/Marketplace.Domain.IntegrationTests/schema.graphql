schema {
  query: Query
  mutation: Mutation
}

type CdnFile {
  url: String!
  height: Int
  width: Int
}

type CdnImageFile {
  original: CdnFile
  thumbnail: CdnFile
}

type ConnectionOfProductEdge {
  pageInfo: PageInfo!
  edges: [ProductEdge!]!
  totalCount: Int!
}

type CurrencyDetails {
  type: Currency!
  name: String!
}

type Mutation {
  addProduct(input: AddProductInput!): ProductPayload! @cost(weight: "10")
  updateProduct(input: UpdateProductInput!): ProductPayload! @cost(weight: "10")
  deleteProducts(input: DeleteProductsInput!): ProductsPayload! @cost(weight: "10")
  activateProducts(input: ActivateProductsInput!): ProductsPayload! @cost(weight: "10")
  deactivateProducts(input: DeactivateProductsInput!): ProductsPayload! @cost(weight: "10")
}

type OrganizationDetails {
  uniqueAlphanumericName: String
  id: ID!
}

type OrganizationTagDetails {
  id: ID!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type PaymentMethodTypeDetails {
  type: PaymentMethod!
  name: String!
}

type ProductDetails {
  organization: OrganizationDetails!
  productTags: [OrganizationTagDetails!]!
  locationTags: [OrganizationTagDetails!]!
  inactive: Boolean!
  name: String!
  description: String
  currency: CurrencyDetails!
  latestProductVersionId: String!
  featureImages: [CdnImageFile!]!
  pricingOptions: [ProductPricing!]!
  id: ID!
}

type ProductEdge {
  node: ProductDetails!
  cursor: String!
}

type ProductPayload {
  clientMutationId: String
  product: ProductDetails!
}

type ProductPricing {
  id: String!
  index: Int!
  name: String!
  description: String!
  cadence: ProductPricingCadence!
  price: Decimal!
  isTaxInclusive: Boolean!
  acceptedPaymentMethods: [PaymentMethod!]!
  minDurationMinutes: Int
  maxDurationMinutes: Int
  maxAllowedResourcesLockTimePaidViaCard: Int!
  maxAllowedResourcesLockTimePaidViaBankTransfer: Int!
  numberOfResourcesToBook: Int!
}

type ProductPricingCadenceDetails {
  type: ProductPricingCadence!
  name: String!
}

type ProductVersionDetails {
  productTags: [OrganizationTagDetails!]!
  locationTags: [OrganizationTagDetails!]!
  inactive: Boolean!
  name: String!
  description: String
  currency: CurrencyDetails!
  featureImages: [CdnImageFile!]!
  pricingOptions: [ProductPricing!]!
  id: ID!
}

type ProductsPayload {
  clientMutationId: String
  products: [ProductDetails!]!
}

type Query {
  product(id: String!): ProductDetails @cost(weight: "10")
  productById(id: String!): ProductDetails @lookup @internal @cost(weight: "10")
  productVersion(id: String!): ProductVersionDetails @cost(weight: "10")
  productVersionById(id: String!): ProductVersionDetails @lookup @internal @cost(weight: "10")
  products(after: String first: Int before: String last: Int where: ProductWhereInput! orderBy: [ProductOrderInput!]): ConnectionOfProductEdge! @cost(weight: "10")
  marketplaceVersion: Version!
  marketplaceCustomerRecordSynced: Boolean! @cost(weight: "10")
  currencies: [CurrencyDetails!]!
  defaultMaxAllowedResourcesLockTimePaidViaCard: Int!
  defaultMaxAllowedResourcesLockTimePaidViaBankTransfer: Int!
  productPricingCadences: [ProductPricingCadenceDetails!]!
  paymentMethods: [PaymentMethodTypeDetails!]!
}

type Version {
  major: Int!
  minor: Int!
  build: Int!
  revision: Int!
}

input ActivateProductsInput {
  clientMutationId: String
  ids: [String!]!
}

input AddProductInput {
  clientMutationId: String
  id: String
  organizationId: String
  organizationUniqueAlphanumericName: String
  name: String!
  description: String
  currency: Currency!
  productTagIds: [String!]!
  locationTagIds: [String!]!
  featureImages: [CdnImageFileInput!]!
  pricingOptions: [ProductPricingInput!]!
}

input CdnFileInput {
  url: String!
  height: Int
  width: Int
}

input CdnImageFileInput {
  original: CdnFileInput
  thumbnail: CdnFileInput
}

input DeactivateProductsInput {
  clientMutationId: String
  ids: [String!]!
}

input DeleteProductsInput {
  clientMutationId: String
  ids: [String!]!
}

input ProductOrderInput {
  direction: OrderDirection!
  field: ProductOrderField!
}

input ProductPricingInput {
  id: String!
  index: Int!
  name: String!
  description: String!
  cadence: ProductPricingCadence!
  price: Decimal!
  isTaxInclusive: Boolean!
  acceptedPaymentMethods: [PaymentMethod!]!
  minDurationMinutes: Int
  maxDurationMinutes: Int
  maxAllowedResourcesLockTimePaidViaCard: Int!
  maxAllowedResourcesLockTimePaidViaBankTransfer: Int!
  numberOfResourcesToBook: Int!
}

input ProductWhereInput {
  organizationUniqueAlphanumericNames: [String!]
  productIds: [String!]
  includeInactive: Boolean!
}

input UpdateProductInput {
  clientMutationId: String
  id: String!
  name: String!
  description: String
  currency: Currency!
  productTagIds: [String!]!
  locationTagIds: [String!]!
  featureImages: [CdnImageFileInput!]!
  pricingOptions: [ProductPricingInput!]!
}

enum Currency {
  NZD
  USD
}

enum OrderDirection {
  ASCENDING
  DESCENDING
}

enum PaymentMethod {
  CARD
  BANK_TRANSFER
}

enum ProductOrderField {
  NAME
}

enum ProductPricingCadence {
  NOT_SET
  ONE_TIME_V1
  PER_MINUTE_V1
  PER_HOUR_V1
  DAILY_V1
  WEEKLY_V1
  MONTHLY_V1
}

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost("The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc." weight: String!) on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM | INPUT_FIELD_DEFINITION

directive @internal on FIELD_DEFINITION

directive @lookup on FIELD_DEFINITION

"The `Decimal` scalar type represents a decimal floating-point number."
scalar Decimal
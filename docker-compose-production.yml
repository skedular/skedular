      ConnectionStrings__teamdb: ${STAGING_POSTGRES_TEAM_CONNECTIONSTRING}
      ConnectionStrings__coredb: ${STAGING_POSTGRES_CORE_CONNECTIONSTRING}
      Application__Environment: staging

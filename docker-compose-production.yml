      AWS_ACCESS_KEY_ID: ${STAGING_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${STAGING_AWS_SECRET_ACCESS_KEY}
      OpenTelemetry__ConsoleEnabled: false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      HttpLogging__Enabled: false
      OpenTelemetry__MetricsIngestEnabled: true
      OpenTelemetry__ExcludeOutboxTelemetry: true
      OpenTelemetry__EntityFrameworkEnabled: false

  kowl:
    image: redpandadata/console:latest
    restart: unless-stopped
    depends_on:
      - kafka1
    environment:
      KAFKA_BROKERS: "kafka1:29092"
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: "http://kafka1:8081"
    ports:
      - 8888:8080
    networks:
      - skedular_network

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    depends_on:
      - postgres18
    environment:
      - DB=postgres12
      - POSTGRES_SEEDS=postgres18
      - DB_PORT=5432
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - POSTGRES_USER=${SKEDULAR_POSTGRES_USERNAME}
      - POSTGRES_PWD=${SKEDULAR_POSTGRES_PASSWORD}
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - skedular_network

  temporal-admin-tools:
    image: temporalio/admin-tools:latest
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    stdin_open: true
    tty: true
    networks:
      - skedular_network

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    depends_on:
      - temporal
    ports:
      - 8080:8080
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    networks:
      - skedular_network


      ConnectionStrings__customerdb: ${STAGING_POSTGRES_CUSTOMER_CONNECTIONSTRING}
      ConnectionStrings__locationdb: ${STAGING_POSTGRES_LOCATION_CONNECTIONSTRING}
      ConnectionStrings__marketplacedb: ${STAGING_POSTGRES_MARKETPLACE_CONNECTIONSTRING}
      ConnectionStrings__msteamsdb: ${STAGING_POSTGRES_MSTEAMS_CONNECTIONSTRING}
      ConnectionStrings__organizationdb: ${STAGING_POSTGRES_ORGANIZATION_CONNECTIONSTRING}
      ConnectionStrings__slackdb: ${STAGING_POSTGRES_SLACK_CONNECTIONSTRING}
      ConnectionStrings__teamdb: ${STAGING_POSTGRES_TEAM_CONNECTIONSTRING}
      ConnectionStrings__coredb: ${STAGING_POSTGRES_CORE_CONNECTIONSTRING}
      Application__Environment: staging
      Kafka__BootstrapServers: "kafka1:29092"
      Kafka__UseSchemaRegistry: true

networks:
  skedular_network:

volumes:
  skedular_postgres18_data:
  skedular_redis_data:
  skedular_kafka1_data:

services:
  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 5001:8080
    networks:
      - skedular_network

  postgres18:
    image: postgis/postgis:18-master
    command: postgres -c 'max_connections=10000' -c
      'shared_preload_libraries=pg_stat_statements'
    restart: unless-stopped
    volumes:
      - skedular_postgres18_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${SKEDULAR_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${SKEDULAR_POSTGRES_PASSWORD}
    ports:
      - "13451:5432"
    networks:
      - skedular_network

  redis:
    image: redis:latest
    restart: unless-stopped
    volumes:
      - skedular_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 100
    networks:
      - skedular_network

  redisinsight:
    image: redislabs/redisinsight:latest
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - skedular_network

  kafka1:
    image: redpandadata/redpanda:latest
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka1:29092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:9100
      - --rpc-addr kafka1:33145
      - --advertise-rpc-addr kafka1:33145
      - --smp 1
      - --default-log-level=info
    volumes:
      - skedular_kafka1_data:/var/lib/redpanda/data
    healthcheck:
      test:
        [ "CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1" ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 90s
    networks:
      - skedular_network

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    restart: unless-stopped
    environment:
      Dashboard__Frontend__AuthMode: "BrowserToken"
      Dashboard__Frontend__BrowserToken: "${ASPIRE_DASHBOARD_TOKEN}"
      Logging__LogLevel__Aspire.Dashboard.Otlp.Storage: "Error"
    ports:
      - "18888:18888"
    networks:
      - skedular_network

  kowl:
    image: redpandadata/console:latest
    restart: unless-stopped
    depends_on:
      - kafka1
    environment:
      KAFKA_BROKERS: "kafka1:29092"
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: "http://kafka1:8081"
    ports:
      - 8888:8080
    networks:
      - skedular_network

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    depends_on:
      - postgres18
    environment:
      - DB=postgres12
      - POSTGRES_SEEDS=postgres18
      - DB_PORT=5432
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - POSTGRES_USER=${SKEDULAR_POSTGRES_USERNAME}
      - POSTGRES_PWD=${SKEDULAR_POSTGRES_PASSWORD}
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - skedular_network

  temporal-admin-tools:
    image: temporalio/admin-tools:latest
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    stdin_open: true
    tty: true
    networks:
      - skedular_network

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    depends_on:
      - temporal
    ports:
      - 8080:8080
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    networks:
      - skedular_network

  staging-infra-provision:
    image: ghcr.io/unityhubio/allinfra:latest
    restart: on-failure
    depends_on:
      kafka1:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__redis: "redis:6379,abortConnect=false"

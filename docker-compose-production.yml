      Kafka__SchemaRegistry__ApiKey: ${STAGING_SCHEMA_REGISTRY_APIKEY:-}
      Kafka__SchemaRegistry__SecretKey: ${STAGING_SCHEMA_REGISTRY_SECRETKEY:-}
